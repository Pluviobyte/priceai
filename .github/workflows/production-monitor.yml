name: PriceAI production health and capacity
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: priceai-production-monitor
  cancel-in-progress: false
jobs:
  monitor:
    if: vars.PRICEAI_MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Check capacity, public readiness and discovery scheduling
        env:
          DEPLOY_KEY: ${{ secrets.PRICEAI_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PRICEAI_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/priceai_deploy
          chmod 600 ~/.ssh/priceai_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/priceai_deploy' EXIT
          failed=0
          printf '%s' '{"action":"status"}' | ssh -T -i ~/.ssh/priceai_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 root@64.186.227.21 | node scripts/check-production-status.mjs || failed=1
          printf '%s' '{"action":"discovery-status"}' | ssh -T -i ~/.ssh/priceai_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 root@64.186.227.21 | node scripts/check-discovery-status.mjs || failed=1
          exit "$failed"
