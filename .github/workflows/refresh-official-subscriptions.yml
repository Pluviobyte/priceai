name: Refresh official subscription prices

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

concurrency:
  group: refresh-official-subscription-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger the protected PriceAI refresh endpoint
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors --max-time 300 \
            --request POST \
            --header "Authorization: Bearer ${{ secrets.OFFICIAL_PRICE_REFRESH_SECRET }}" \
            https://priceai-compare.vercel.app/api/cron/official-subscriptions
